# ============================================================
# Déploiement Render — SANS Docker (plus simple et plus rapide)
#
# Render installe Node, compile l'interface puis démarre le serveur.
# Aucune image à construire : moins de choses peuvent échouer.
#
# PRÉREQUIS : la racine du dépôt doit contenir les dossiers
#   client/   et   serveur/
# ============================================================
services:
  - type: web
    name: aifg-rh
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/sante
    buildCommand: |
      set -e
      echo "--- Vérification de la structure du dépôt ---"
      test -d client   || { echo "ERREUR : dossier client/ absent du dépôt"; exit 1; }
      test -d serveur  || { echo "ERREUR : dossier serveur/ absent du dépôt"; exit 1; }
      echo "--- Compilation de l'interface ---"
      cd client
      # npm ci si le verrou est present (installation reproductible), sinon npm install.
      if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      npx vite build
      cd ..
      echo "--- Copie de l'interface dans le serveur ---"
      mkdir -p serveur/public && cp -r client/dist/* serveur/public/
      echo "--- Dépendances du serveur ---"
      cd serveur
      if [ -f package-lock.json ]; then npm ci --omit=dev --no-audit --no-fund; else npm install --omit=dev --no-audit --no-fund; fi
    startCommand: cd serveur && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOTE
        value: 0.0.0.0
      - key: MODE_DEMONSTRATION
        value: "true"
      - key: STOCKAGE_EPHEMERE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aifg-rh-base
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_SECRET_RAFRAICHISSEMENT
        generateValue: true
      - key: MDP_INITIAL_RH
        sync: false
      - key: MDP_INITIAL_DIRECTION
        sync: false
      - key: EMAIL_RH
        value: rh@aifg.dz

databases:
  - name: aifg-rh-base
    plan: free
    region: frankfurt
